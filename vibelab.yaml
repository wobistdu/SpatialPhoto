app:
  id: "7707552383781535798"
  name: SpatialPhoto
  slogan: 轻轻侧头，照片有了纵深。
  description: 窗边的一枝花，桌沿的一束光。戴上 PICO，在取景框里按下快门，SpatialPhoto 会在头显上把这张照片重建成空间照片。打开相册，轻轻侧头，看花瓣与身后的窗景错开一点。重建约需一分钟，等待时可以继续拍摄，照片会按顺序处理。支持在普通窗口切换 2D 与 3D，也可导出照片和 PLY。单张照片适合小角度观看。本应用与随附模型仅供许可允许的非商业科学研究和学术活动，排除商业利用和产品开发。
  tags:
    - 实用工具
  category: application
  icon: release-assets/icon.png
  landscape: release-assets/landscape.jpg
  detail_images:
    - release-assets/detail.jpg
  videos: []
version:
  name: 0.32-research
  notes: 更新三层空间桌面图标和作品展示图；修复首次拍照时相册目录尚未建立导致的保存失败。保留 768 输入、25 万高斯的端侧单图重建与小角度浏览。
build:
  repo_url: https://github.com/wobistdu/SpatialPhoto
  repo_visibility: public
  tech_stack: android_spatial
  ai_tool: Codex
  ai_model: GPT-6.1
  features:
    - mixed_reality
    - hand_tracking
    - controller_support
  teammates: []
