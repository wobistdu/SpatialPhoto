app:
  id: "7707552383781535798"
  name: 空间拍照
  slogan: 轻轻侧头，照片有了纵深。
  description: 窗边的一枝花，桌沿的一束光。戴上 PICO，在取景框里按下快门，空间拍照会在头显上把这张照片重建成空间照片。打开相册，轻轻侧头，看花瓣与身后的窗景错开一点。重建约需一分钟，等待时可以继续拍摄，照片会按顺序处理。支持在普通窗口切换 2D 与 3D，也可导出照片和 PLY。单张照片适合小角度观看。本应用与随附模型仅供许可允许的非商业科学研究和学术活动，排除商业利用和产品开发。
  tags:
    - 实用工具
  category: application
  icon: release-assets/icon.png
  landscape: release-assets/landscape.jpg
  detail_images:
    - release-assets/detail.jpg
  videos: []
version:
  name: 0.35-w8-research
  notes: 更名为空间拍照，更新三层桌面图标。首次拍摄新增取景示例和等待说明，相机启动时按钮变灰，文字保持稳定。仅供非商业科研用途。
